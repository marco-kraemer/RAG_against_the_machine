[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.13.0",
    "bm25s>=0.3.4",
    "chromadb>=1.5.8",
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.2.6",
    "pydantic>=2.13.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "sentence-transformers>=5.4.1",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "transformers>=5.5.4",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "flake8>=7.3.0",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
]

[tool.mypy]
exclude = [
    '^vllm-0.10.1/',
    '^\.venv/',
    '^datasets_public/'
]
